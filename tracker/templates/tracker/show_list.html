{% extends 'base.html' %}
{% block content %}
<h2>My Shows</h2>
<a href="{% url 'add_show' %}" class="btn btn-primary mb-3">Add Show</a>
<ul class="list-group">
    {% for show in shows %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'show_detail' show.id %}">{{ show.title }}</a>
        <span class="badge bg-secondary">{{ show.episode_count }} episodes</span>
    </li>
    {% empty %}
    <li class="list-group-item">No shows yet.</li>
    {% endfor %}
</ul>
{% endblock %}
